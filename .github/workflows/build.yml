name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: solanalabs/solana:v1.18.26

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Anchor CLI
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v0.31.2/install)"

      - name: Compilar
        run: cargo build-sbf

      - uses: actions/upload-artifact@v4
        with:
          name: vault-so
          path: target/deploy/*.so
