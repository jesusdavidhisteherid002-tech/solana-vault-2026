name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Agave (toolchain SBF)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.21/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Downgrade transitivas incompatibles
        run: |
          cargo update -p blake3 --precise 1.5.5
          cargo update -p zeroize --precise 1.8.1
          cargo update -p curve25519-dalek --precise 4.1.3
          cargo update -p serde --precise 1.0.210
          cargo update -p thiserror --precise 1.0.63

      - name: Compilar
        run: cargo build-sbf

      - uses: actions/upload-artifact@v4
        with:
          name: vault-so
          path: target/deploy/*.so
